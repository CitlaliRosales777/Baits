limit_req_zone $binary_remote_addr zone=moodsitto_api_limit:10m rate=15r/s;
map $http_origin $moodsitto_cors_origin {
    default "";
    "~^http://localhost(:[0-9]{1,5})?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]{1,5})?$" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.lvltechmx.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.lvltechmx.com;

    ssl_certificate /etc/letsencrypt/live/api.lvltechmx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lvltechmx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=moodsitto_api_limit burst=30 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $moodsitto_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $moodsitto_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags PHPSESSID secure httponly samesite=none;
    }
}

