services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MOODSITTO_TEST_ROOT_PASSWORD:?required}
    volumes:
      - ../../databases/mariadb:/database:ro
      - ./tests:/api-tests:ro
      - apicore_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [apicore_test]

  api:
    build: .
    environment:
      MOODSITTO_DB_HOST: mariadb
      MOODSITTO_DB_PORT: 3306
      MOODSITTO_DB_NAME: moodsitto
      MOODSITTO_DB_USER: moodsitto_api
      MOODSITTO_DB_PASSWORD: ${MOODSITTO_TEST_APP_PASSWORD:?required}
      MOODSITTO_API_SECRET: ${MOODSITTO_TEST_API_SECRET:?required}
      MOODSITTO_API_HOST: 0.0.0.0
      MOODSITTO_API_PORT: 65000
    volumes:
      - ./tests:/tests:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:65000/healthcheck', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [apicore_test]

volumes:
  apicore_test_data:

networks:
  apicore_test:

