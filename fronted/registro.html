<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-acceso">
    <!-- encabezado -->
    <header class="encabezado">
        <a href="index.html" class="marca" aria-label="Moodsitto, inicio">
            <img src="img/Moodsitto_snFondo.png" alt="Moodsitto" class="logo">
        </a>
        <nav class="menu-principal" aria-label="Menu principal">
            <a href="index.html" class="menu-enlace">Inicio</a>
            <a href="login.html" class="menu-enlace">Iniciar sesión</a>
            <a href="registro.html" class="menu-enlace destacado activo" aria-current="page">Crear cuenta</a>
        </nav>
    </header>

    <!-- registro del usuario -->
    <main class="pagina-formulario">
        <section class="formulario formulario-amplio">
            <span class="etiqueta">ÚNETE A MOODSITTO</span>
            <h1>Crear cuenta</h1>
            <p class="texto-suave">Completa tus datos para comenzar.</p>
            <form id="registro-form">
                <div class="columnas">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="name" autocomplete="given-name" maxlength="70" required>
                    </div>
                    <div>
                        <label for="apellido1">Apellido paterno</label>
                        <input type="text" id="apellido1" name="lastname1" autocomplete="family-name" maxlength="70" required>
                    </div>
                    <div>
                        <label for="apellido2">Apellido materno (opcional)</label>
                        <input type="text" id="apellido2" name="lastname2" maxlength="70">
                    </div>
                    <div>
                        <label for="nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="nacimiento" name="date_b" required>
                    </div>
                    <div>
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="phone" autocomplete="tel" maxlength="20" required>
                    </div>
                    <div>
                        <label for="emergencia">Teléfono de emergencia (opcional)</label>
                        <input type="tel" id="emergencia" name="emer_phone" maxlength="20">
                    </div>
                </div>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="mail" autocomplete="email" maxlength="150" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="passw" autocomplete="new-password" minlength="8" required>
                <p class="ayuda-campo">Mínimo 8 caracteres.</p>

                <button type="submit" class="boton ancho">Crear cuenta</button>
                <p id="registro-mensaje" class="mensaje" role="status" aria-live="polite"></p>
            </form>

            <p class="pie-formulario">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        </section>
    </main>

    <footer>Moodsitto · 2026</footer>
    <script src="js/main.js"></script>
</body>
</html>
