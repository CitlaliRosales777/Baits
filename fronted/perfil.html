<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="pagina-perfil">

    <!-- encabezado del perfil -->
    <section class="encabezado-perfil"></section>

    <!-- contenido del perfil -->
    <section class="contenido-perfil">

        <!-- foto del usuario -->
        <div class="foto-perfil">
            <span>foto</span>
        </div>

        <!-- nombre de la pantalla -->
        <h1 class="titulo-perfil">mi perfil</h1>

        <!-- datos del usuario -->
        <div class="datos-perfil">

            <div class="campo-perfil">
                <label>nombre</label>
                <input type="text" placeholder="nombre del usuario" readonly>
            </div>

            <div class="campo-perfil">
                <label>correo</label>
                <input type="email" placeholder="correo del usuario" readonly>
            </div>

            <div class="campo-perfil">
                <label>telefono</label>
                <input type="tel" placeholder="numero de telefono" readonly>
            </div>

            <div class="campo-perfil">
                <label>fecha de nacimiento</label>
                <input type="text" placeholder="dd/mm/aaaa" readonly>
            </div>

        </div>
    </section>

</main>
</body>
</html>
