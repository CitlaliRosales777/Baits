<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de emociones | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="pagina-emociones">
    <!-- encabezado de emociones -->
    <section class="saludo">
        <h1 class="titulo-emociones">Registro de emociones</h1>

        <!-- olita de moodsitto -->
        <svg class="ola"
             viewBox="0 0 600 120"
             preserveAspectRatio="none">
            <path d="M0 0
                     C30 95, 90 75, 155 65
                     C235 35, 310 80, 395 105
                     C475 125, 535 80, 600 20
                     L600 120 L0 120 Z"
                  fill="#F2E9E4"/>
        </svg>
    </section>
    <!-- registro emocional -->
    <section class="contenido-emociones">
        <h2>¿Qué sucede?</h2>
        <!-- espacio para escribir -->
        <input type="text"
               id="descripcion-emocion"
               placeholder="escribe lo que sientes">
    </section>
</main>
</body>
</html>
