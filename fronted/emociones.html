<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de emociones | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="pagina-emociones">
        <!-- encabezado -->
        <section class="saludo">
            <h1 class="titulo-emociones">Registro de emociones</h1>
            <!-- olita de moodsitto -->
            <svg class="ola" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 0 C30 95, 90 75, 155 65 C235 35, 310 80, 395 105 C475 125, 535 80, 600 20 L600 120 L0 120 Z" fill="#F2E9E4"/>
            </svg>
        </section>

        <!-- formulario de emociones -->
        <section class="contenido-emociones">
            <h2>¿Qué sucede?</h2>
            <p class="texto-emociones">Tómate un momento para expresar cómo te sientes.</p>

            <form id="form-emociones">
                <label for="descripcion-emocion">¿Cómo te sientes en este momento?</label>
                <textarea id="descripcion-emocion" placeholder="Escribe lo que sientes..." maxlength="1000" rows="6"></textarea>
                <button type="submit" class="boton continuar-emociones">Guardar registro</button>
                <p id="mensaje-emociones" role="status" aria-live="polite"></p>
            </form>

            <!-- historial de registros -->
            <section class="historial-registro">
                <h2>Mis registros</h2>
                <div id="lista-registros-emocionales"></div>
            </section>

            <!-- volver al dashboard -->
            <a href="dashboard.html" class="volver-inicio">Volver al inicio</a>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
