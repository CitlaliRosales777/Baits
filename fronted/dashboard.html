<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="inicio-app">
    <!-- encabezado de moodsitto -->
    <section class="saludo">
        <img src="img/Moodsitto_snFondo.png"
             alt="Moodsitto"
             class="logo-principal">

        <!-- olita de moodsitto uwu -->
        <svg class="ola"
             viewBox="0 0 600 120"
             preserveAspectRatio="none"
             aria-hidden="true">
            <path d="M0 0
                     C30 95, 90 75, 155 65
                     C235 35, 310 80, 395 105
                     C475 125, 535 80, 600 20
                     L600 120 L0 120 Z"
                  fill="#F2E9E4"/>
        </svg>
    </section>
    <!-- saludito del usuario -->
    <section class="bienvenido">
        <h2>¿Qué tal?</h2>
        <p>@usuario</p>
    </section>

    <!-- calendario semanal -->
    <section class="calendario">
        <h3>Mi semana</h3>

        <div class="semana">
            <div class="dia" tabindex="0" role="button">
                <span>Lun</span>
                <strong>1</strong>
            </div>

            <div class="dia" tabindex="0" role="button">
                <span>Mar</span>
                <strong>2</strong>
            </div>

            <div class="dia" tabindex="0" role="button">
                <span>Mie</span>
                <strong>3</strong>
            </div>

            <div class="dia" tabindex="0" role="button">
                <span>Jue</span>
                <strong>4</strong>
            </div>

            <div class="dia" tabindex="0" role="button">
                <span>Vie</span>
                <strong>5</strong>
            </div>

            <div class="dia" tabindex="0" role="button">
                <span>Sab</span>
                <strong>6</strong>
            </div>

            <div class="dia" tabindex="0" role="button">
                <span>Dom</span>
                <strong>7</strong>
            </div>
        </div>
    </section>
    <!-- recordatorios -->
    <section class="recordatorios">
        <h3>Mis recordatorios</h3>
        <!-- medicamento 1 -->
        <div class="recordatorio">
            <span>Medicamento 1</span>
            <span>8:00 a. m.</span>

            <div class="acciones-recordatorio">
                <button type="button" class="completar"
                        aria-label="marcar como realizado">✓</button>
                <button type="button" class="descartar"
                        aria-label="eliminar recordatorio">×</button>
            </div>
        </div>
        <!-- medicamento 2 -->
        <div class="recordatorio">
            <span>Medicamento 2</span>
            <span>12:00 p. m.</span>
            <div class="acciones-recordatorio">
                <button type="button" class="completar"
                        aria-label="marcar como realizado">✓</button>
                <button type="button" class="descartar"
                        aria-label="eliminar recordatorio">×</button>
            </div>
        </div>
        <!-- cita medica -->
        <div class="recordatorio cita">
            <span class="texto-con-icono">
                <img src="img/icono-cita.svg"
                     alt=""
                     class="icono-cita-img">
                Cita medica
            </span>
            <span>3:00 p. m.</span>

            <div class="acciones-recordatorio">
                <button type="button" class="completar"
                        aria-label="marcar como realizado">✓</button>
                <button type="button" class="descartar"
                        aria-label="eliminar recordatorio">×</button>
            </div>
        </div>

        <!-- mensaje cuando no hay recordatorios -->
        <p class="sin-recordatorios" hidden>
            no hay recordatorios para este dia
        </p>
    </section>

    <!-- agregar recordatorios -->
    <div class="zona-agregar">

        <!-- boton para ir al formulario -->
        <button type="button"
                class="agregar-recordatorio"
                aria-label="agregar recordatorio">+</button>

        <!-- barra inferior -->
        <div class="barra-recordatorio">

            <form id="form-recordatorio">

                <!-- tipo de recordatorio -->
                <select id="tipo-recordatorio"
                        aria-label="tipo de recordatorio">
                    <option value="medicamento">Medicamento</option>
                    <option value="cita">Cita medica</option>
                </select>

                <!-- nombre -->
                <input type="text"
                       id="nombre-recordatorio"
                       placeholder="nombre del recordatorio"
                       aria-label="nombre del recordatorio"
                       required>
                <!-- hora -->
                <input type="time"
                       id="hora-recordatorio"
                       aria-label="hora del recordatorio"
                       required>
                <!-- guardar en la lista -->
                <button type="submit">agregar</button>
            </form>
        </div>
    </div>
</main>
<!-- funciones de moodsitto -->
<script src="js/main.js"></script>
</body>
</html>
