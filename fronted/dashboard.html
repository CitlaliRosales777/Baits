
<!DOCTYPE html>
<html lang="es">
<head>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="inicio-app">
    <section class="saludo">
        <img src="img/Moodsitto_snFondo.png"
             alt="Moodsitto"
             class="logo-principal">
        <!--olita de moodsittoooo jeje-->
        <svg class="ola"
             viewBox="0 0 600 120"
             preserveAspectRatio="none"
             aria-hidden="true">

            <path d="M0 0
                     C30 95, 90 75, 155 65
                     C235 35, 310 80, 395 105
                     C475 125, 535 80, 600 20
                     L600 120 L0 120 Z"
                  fill="#F2E9E4"/>
        </svg>
    </section>
    <section class="bienvenido">
        <h2>¿Qué tal?</h2>
        <p>@usuario</p>
    </section>
    <!-- calendario -->
     <section class="calendario">
        <h3>Mi semana</h3>
        <div class="semana">
            <div class="dia seleccionado">
                <span>Lun</span>
                <strong>1</strong>
            </div>
            <div class="dia">
                <span>Mar</span>
                <strong>2</strong>
        </div>
            <div class="dia">
                <span>Mie</span>
                <strong>3</strong>
        </div>
           <div class="dia">
                <span>Jue</span>
                <strong>4</strong>
        </div>
            <div class="dia">
                <span>Vie</span>
                <strong>3</strong>
        </div>
            <div class="dia">
                <span>Sab</span>
                <strong>6</strong>
        </div>
            <div class="dia">
                <span>Dom</span>
                <strong>7</strong>
            </div>
        </div>
     </section>

<!-- recordatorios -->
<section class="recordatorios">
    <h3>Mis recordatorios</h3>

    <!-- medicamento 1 -->
    <div class="recordatorio">
        <span>Medicamento 1</span>
        <span>8:00 a. m.</span>

        <div class="acciones-recordatorio">
            <button type="button" class="completar">✓</button>
            <button type="button" class="descartar">×</button>
        </div>
    </div>

    <!-- medicamento 2 -->
    <div class="recordatorio">
        <span>Medicamento 2</span>
        <span>12:00 p. m.</span>
        <div class="acciones-recordatorio">
            <button type="button" class="completar">✓</button>
            <button type="button" class="descartar">×</button>
        </div>
    </div>
    <!-- cita medica -->
    <div class="recordatorio">
        <span>
            <span class="icono-cita">△</span>
            Cita medica
        </span>
        <span>3:00 p. m.</span>
        <div class="acciones-recordatorio">
            <button type="button" class="completar">✓</button>
            <button type="button" class="descartar">×</button>
        </div>
    </div>
</section>
</main>
<!-- funciones de moodsitto -->
<script src="js/main.js"></script>
</body>
</html>
</body>
</html>
