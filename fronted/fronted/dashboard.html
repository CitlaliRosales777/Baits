<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi espacio | Moodsitto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="inicio-app">
    <!-- encabezado -->
    <header class="encabezado">
        <a href="dashboard.html" class="marca" aria-label="Moodsitto, dashboard">
            <img src="img/Moodsitto_snFondo.png" alt="Moodsitto" class="logo">
        </a>
        <nav class="menu-principal" aria-label="Menu principal">
            <a href="dashboard.html" class="menu-enlace activo" aria-current="page">Mi inicio</a>
            <a href="trackingmazz0o.html" class="menu-enlace">Mis emociones</a>
            <a href="perfil.html" class="menu-enlace destacado">Mi perfil</a>
        </nav>
    </header>

    <main>
        <!-- saludo con olita -->
        <section class="saludo">
            <h1>¿Qué tal?</h1>
            <svg class="ola" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 0 C30 95, 90 75, 155 65 C235 35, 310 80, 395 105 C475 125, 535 80, 600 20 L600 120 L0 120 Z" fill="#F2E9E4"/>
            </svg>
        </section>

        <!-- acceso a tarjetas -->
        <section class="area-principal">
            <a href="trackingmazz0o.html" class="tarjeta-acceso">
                <span class="acceso-icono" aria-hidden="true">♡</span>
                <span class="acceso-info">
                    <strong>Registrar mis emociones</strong>
                </span>
                <span class="acceso-flecha" aria-hidden="true">›</span>
            </a>
        </section>

        <!-- calendario semanal -->
        <section class="calendario">
            <div class="cabecera-semana">
                <h2>Mi semana</h2>
                <div class="controles-semana">
                    <button type="button" id="semana-anterior" aria-label="Semana anterior">&#8249;</button>
                    <span id="rango-semana" aria-live="polite"></span>
                    <button type="button" id="semana-siguiente" aria-label="Semana siguiente">&#8250;</button>
                </div>
            </div>
            <div class="semana" aria-label="Días de la semana">
                <div class="dia" tabindex="0" role="button"><span>Lun</span><strong>1</strong></div>
                <div class="dia" tabindex="0" role="button"><span>Mar</span><strong>2</strong></div>
                <div class="dia" tabindex="0" role="button"><span>Mié</span><strong>3</strong></div>
                <div class="dia" tabindex="0" role="button"><span>Jue</span><strong>4</strong></div>
                <div class="dia" tabindex="0" role="button"><span>Vie</span><strong>5</strong></div>
                <div class="dia" tabindex="0" role="button"><span>Sáb</span><strong>6</strong></div>
                <div class="dia" tabindex="0" role="button"><span>Dom</span><strong>7</strong></div>
            </div>
        </section>

        <!-- recordatorios -->
        <section class="recordatorios">
            <h2>Mis recordatorios</h2>
            <p class="sin-recordatorios" role="status" aria-live="polite">No tienes recordatorios para este día.</p>
        </section>

        <!-- formulario desplegable -->
        <details class="zona-agregar" id="panel-recordatorio">
            <summary class="abrir-recordatorio">
                <span class="icono-agregar" aria-hidden="true">+</span>
                <span class="texto-abrir">Nuevo recordatorio</span>
                <span class="texto-cerrar">Cerrar formulario</span>
            </summary>
            <div class="barra-recordatorio">
                <form id="form-recordatorio">
                    <div class="campo-recordatorio">
                        <label for="tipo-recordatorio">Tipo</label>
                        <select id="tipo-recordatorio">
                            <option value="medicamento">Medicamento</option>
                            <option value="cita">Cita médica</option>
                            <option value="actividad">Actividad</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="campo-recordatorio">
                        <label for="nombre-recordatorio">Nombre</label>
                        <input type="text" id="nombre-recordatorio" placeholder="Nombre del recordatorio" maxlength="100" required>
                    </div>
                    <div class="campo-recordatorio" id="campo-dosis">
                        <label for="dosis-recordatorio">Dosis (opcional)</label>
                        <input type="text" id="dosis-recordatorio" placeholder="Dosis indicada" maxlength="50">
                    </div>
                    <div class="campo-recordatorio">
                        <label for="hora-recordatorio">Horario</label>
                        <input type="time" id="hora-recordatorio" required>
                    </div>
                    <div class="campo-recordatorio">
                        <label for="fecha-inicio">Fecha de inicio</label>
                        <input type="date" id="fecha-inicio" required>
                    </div>
                    <div class="campo-recordatorio">
                        <label for="repeticion-recordatorio">Repetición</label>
                        <select id="repeticion-recordatorio">
                            <option value="una">Solo ese día</option>
                            <option value="diaria">Todos los días</option>
                            <option value="semanal">Días de la semana</option>
                        </select>
                    </div>
                    <div class="campo-recordatorio" id="campo-fecha-fin" hidden>
                        <label for="fecha-fin">Fecha final</label>
                        <input type="date" id="fecha-fin" disabled>
                    </div>
                    <fieldset id="dias-repeticion" hidden disabled>
                        <legend>Días de repetición</legend>
                        <label><input type="checkbox" value="1"> Lunes</label>
                        <label><input type="checkbox" value="2"> Martes</label>
                        <label><input type="checkbox" value="3"> Miércoles</label>
                        <label><input type="checkbox" value="4"> Jueves</label>
                        <label><input type="checkbox" value="5"> Viernes</label>
                        <label><input type="checkbox" value="6"> Sábado</label>
                        <label><input type="checkbox" value="7"> Domingo</label>
                    </fieldset>
                    <button type="submit" class="boton boton-guardar">Agregar</button>
                    <p id="mensaje-recordatorio" role="status" aria-live="polite"></p>
                </form>
            </div>
        </details>
    </main>

    <footer>Moodsitto · 2026</footer>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
