<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Iniciar sesión | Moodsitto</title>
    <link rel="icon" type="image/svg+xml" href="img/moodsitto-logo.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-acceso">
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

    <!-- encabezado -->
    <header class="encabezado" id="arriba" tabindex="-1">
        <a href="index.html" class="marca" aria-label="Moodsitto, inicio">
            <img src="img/moodsitto-logo.svg" alt="" width="44" height="44" class="marca-simbolo">
            <span class="marca-nombre">
                <img src="img/moodsitto-nombre.webp" alt="" width="320" height="74" class="logo">
            </span>
        </a>
        <nav class="menu-principal" aria-label="Menú principal">
            <a href="index.html" class="menu-enlace" data-icono="inicio">Inicio</a>
            <a href="login.html" class="menu-enlace activo" data-icono="entrar" aria-current="page">Iniciar sesión</a>
            <a href="registro.html" class="menu-enlace destacado" data-icono="registro">Crear cuenta</a>
        </nav>
    </header>

    <!-- acceso del usuario -->
    <main id="contenido" class="pagina-formulario" tabindex="-1">
        <section class="formulario">
            <h1>Bienvenida de nuevo</h1>
            <p class="texto-suave">Ingresa a tu espacio personal.</p>

            <form id="login-form">
                <!-- APIcore admite el correo o el nombre de usuario de la cuenta. -->
                <label for="correo">Correo o nombre de usuario</label>
                <input
                    type="text"
                    id="correo"
                    name="mail"
                    placeholder="Correo o nombre de usuario"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="150"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="passw"
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="boton ancho" data-icono="entrar">
                    Iniciar sesión
                </button>

                <p id="login-mensaje" class="mensaje" role="status" aria-live="polite"></p>
            </form>

            <p class="pie-formulario">
                ¿Aún no tienes una cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>
        </section>
    </main>

    <!-- pie de pagina -->
    <footer class="pie-sitio">
        <div class="pie-contenido">
            <a href="index.html" class="pie-marca">
                <img src="img/moodsitto-logo.svg" alt="" width="26" height="26">
                <span>Moodsitto</span>
            </a>
            <small>© 2026</small>
            <a href="#arriba" class="pie-arriba">Volver arriba</a>
        </div>
    </footer>

    <!-- conexion con la api -->
    <script src="js/api.js"></script>

    <!-- inicio de sesion -->
    <script src="js/auth.js"></script>
</body>
</html>
