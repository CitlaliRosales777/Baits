<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Mazzo | Moodsitto</title>
    <link rel="icon" type="image/svg+xml" href="img/moodsitto-logo.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-tracking">
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
    <!-- encabezado -->
    <header class="encabezado">
        <a href="dashboard.html" class="marca" aria-label="Moodsitto, dashboard">
            <img src="img/moodsitto-logo.svg" alt="" width="44" height="44" class="marca-simbolo">
            <span class="marca-nombre">
                <img src="img/Moodsitto_snFondo.png" alt="" width="6666" height="3750" class="logo">
            </span>
        </a>
        <nav class="menu-principal" aria-label="Menu principal">
            <a href="dashboard.html" class="menu-enlace" data-icono="inicio">Mi inicio</a>
            <a href="trackingmazz0o.html" class="menu-enlace activo" data-icono="emociones" aria-current="page">Mis emociones</a>
            <a href="perfil.html" class="menu-enlace destacado" data-icono="perfil">Mi perfil</a>
        </nav>
    </header>

    <!-- titulo y olita -->
    <section class="saludo">
        <h1>Mis emociones</h1>
        <p>Elige lo que sientes y ponle un matiz.</p>
        <svg class="ola" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 0 C30 95, 90 75, 155 65 C235 35, 310 80, 395 105 C475 125, 535 80, 600 20 L600 120 L0 120 Z" fill="#F2E9E4"/>
        </svg>
    </section>

    <main id="contenido" class="contenido-tracking" tabindex="-1">
        <!-- cartas principales -->
        <section id="rueda">
            <p class="intro-tracking" id="estado-cartas" role="status" tabindex="-1">Cargando las cartas…</p>
            <div id="agregadas" aria-live="polite"></div>
            <div id="mazo"></div>
        </section>

        <!-- detalle de la emocion -->
        <section id="detalle">
            <div class="detalle-carta">
                <div id="carta-grande" class="carta grande"></div>
            </div>
            <div class="derecha">
                <button type="button" class="volver" id="btn-volver" data-icono="anterior">Volver a las cartas</button>
                <h2 id="pregunta">¿Cómo te sientes?</h2>
                <p class="pista">Elige uno o varios matices que describan lo que sientes.</p>
                <div id="secundarias"></div>
                <div id="terciarias" hidden></div>

                <div class="campo">
                    <label for="nota">¿Qué lo provocó? (opcional)</label>
                    <textarea id="nota" maxlength="1000" placeholder="Si quieres, cuéntalo aquí…"></textarea>
                </div>
                <div class="campo">
                    <label for="intensidad">Intensidad</label>
                    <div class="escala">
                        <input type="range" id="intensidad" min="1" max="10" value="5">
                        <output id="valor" for="intensidad">5</output>
                    </div>
                    <div class="extremos">
                        <span>Muy poco</span>
                        <span>Muy fuerte</span>
                    </div>
                </div>
                <div class="acciones">
                    <button type="button" class="mazo-btn principal" id="btn-guardar" data-icono="confirmar" disabled>Guardar registro</button>
                    <button type="button" class="mazo-btn" id="btn-otra" data-icono="agregar" disabled>Agregar otra emoción</button>
                </div>
            </div>
        </section>

        <!-- historial -->
        <section id="historial">
            <h2>Mis registros</h2>
            <div id="entradas">
                <p class="vacio">Aún no tienes registros.</p>
            </div>
        </section>
        <a href="dashboard.html" class="volver-inicio">Volver al inicio</a>
    </main>

    <div class="aviso-mazo" id="quemao" role="status" aria-live="polite"></div>

    <!-- conexion con la api -->
    <script src="js/api.js"></script>

    <!-- control de sesion -->
    <script src="js/auth.js"></script>

    <script>
        const emociones = new Map();
        let huellaCatalogo;
        let cargandoCatalogo = false;
        let reintentoCatalogo;

        // seleccion actual e historial
        let emocionActual = null;
        let ultimaCarta = null;
        let secundariasElegidas = [];
        let terciariasElegidas = [];
        let grupoActual = [];
        let historial = [];
        const rutaEmociones = "/tablero/emociones";
        let guardandoEmocion = false;
        let intentoEmocion = null;

        // Consulta el historial del usuario en MongoDB a través de APIcore.
        async function cargarHistorial() {
            if (!sesion.token()) return;
            try {
                historial = (await api("GET", rutaEmociones)).data;
                mostrarHistorial();
            } catch (error) {
                $("entradas").textContent = error.message;
            }
        }

        // busca un elemento por su id
        function $(id) {
            return document.getElementById(id);
        }

        async function cargarCatalogo() {
            if (!sesion.token() || cargandoCatalogo) return;
            clearTimeout(reintentoCatalogo);
            cargandoCatalogo = true;
            const estado = $("estado-cartas");
            try {
                const { data } = await api("GET", "/tablero/catalogo-emociones", undefined, AbortSignal.timeout(7000));
                if (!Array.isArray(data)) throw new Error("Formato de catálogo inválido.");
                const huella = JSON.stringify(data);
                if (huella !== huellaCatalogo) {
                    actualizarCartas(data);
                    huellaCatalogo = huella;
                }
                estado.textContent = emociones.size ? "Elige una carta para comenzar." : "Todavía no hay cartas activas.";
            } catch (error) {
                estado.textContent = "No se pudo actualizar el catálogo de emociones.";
                if (error.status === 0 || error.status >= 500) reintentoCatalogo = setTimeout(cargarCatalogo, 4000);
            } finally {
                cargandoCatalogo = false;
            }
        }

        function actualizarCartas(cartas) {
            const iconos = ["miedo", "enojo", "tristeza", "alegria", "poder", "paz"];
            const cartaActiva = $("mazo").contains(document.activeElement) && document.activeElement.dataset.codigo;
            emociones.clear();
            for (const carta of cartas) {
                emociones.set(carta.codigo, {
                    codigo: carta.codigo,
                    nombre: carta.nombre,
                    claveRegistro: carta.clave_registro || carta.nombre,
                    significado: carta.descripcion || "",
                    color: /^#[\da-f]{6}$/i.test(carta.color) ? carta.color : "var(--lila)",
                    icono: iconos.includes(carta.icono) ? carta.icono : "general",
                    secundarias: new Map((carta.matices || []).map(matiz => [matiz.nombre, matiz.detalles]))
                });
            }
            dibujarMazo();
            mostrarHistorial();
            if (cartaActiva) enfocarCarta(cartaActiva);
        }

        function colorDeRegistro(nombre) {
            for (const carta of emociones.values()) {
                if (carta.nombre === nombre || carta.claveRegistro === nombre) return carta.color;
            }
            return "var(--morado)";
        }

        function nombreVisible(nombre) {
            if (nombre === "Enojao") return "Enojo";
            if (nombre === "Troste") return "Tristeza";
            return nombre;
        }

        function completarCarta(elemento, nombre, datos) {
            const titulo = document.createElement("span");
            titulo.className = "nombre";
            titulo.textContent = nombre;
            if (!datos) {
                elemento.replaceChildren(titulo);
                return;
            }

            const figura = document.createElement("span");
            figura.className = "carta-ilustracion";
            figura.setAttribute("aria-hidden", "true");
            const ns = "http://www.w3.org/2000/svg";
            const icono = document.createElementNS(ns, "svg");
            icono.setAttribute("viewBox", "0 0 48 48");
            icono.setAttribute("focusable", "false");
            const referencia = document.createElementNS(ns, "use");
            referencia.setAttribute("href", "img/emociones.svg#" + datos.icono);
            icono.appendChild(referencia);
            figura.appendChild(icono);

            const significado = document.createElement("span");
            significado.className = "carta-significado";
            significado.textContent = datos.significado;
            elemento.replaceChildren(figura, titulo, significado);
            if (elemento.tagName === "BUTTON") {
                significado.id = "significado-" + datos.codigo;
                elemento.setAttribute("aria-label", titulo.textContent);
                elemento.setAttribute("aria-describedby", significado.id);
            }
        }

        function crearCarta(nombre, color, clase, datos) {
            const boton = document.createElement("button");
            boton.type = "button";
            boton.className = "carta " + clase;
            boton.style.setProperty("--c", color);
            completarCarta(boton, nombre, datos);
            return boton;
        }

        // Muestra las cartas activas del catálogo.
        function dibujarMazo() {
            const contenedor = $("mazo");
            contenedor.innerHTML = "";

            for (const [codigo, datos] of emociones) {
                const carta = crearCarta(
                    datos.nombre,
                    datos.color,
                    "principal",
                    datos
                );
                carta.dataset.codigo = codigo;
                carta.addEventListener("click", () => {
                    ultimaCarta = codigo;
                    abrirEmocion(codigo);
                });
                contenedor.appendChild(carta);
            }
        }

        function enfocarCarta(codigo) {
            const cartas = Array.from($("mazo").children);
            const carta = cartas.find(boton => boton.dataset.codigo === codigo) || cartas[0] || $("estado-cartas");
            carta.focus();
        }

        // abre la emocion elegida
        function abrirEmocion(codigo) {
            emocionActual = emociones.get(codigo);
            secundariasElegidas = [];
            terciariasElegidas = [];
            $("rueda").hidden = true;
            $("detalle").classList.add("visible");

            const datos = emocionActual;
            const grande = $("carta-grande");
            grande.style.setProperty("--c", datos.color);
            completarCarta(grande, datos.nombre, datos);

            $("pregunta").textContent = datos.secundarias.size
                ? "Matices de " + datos.nombre.toLowerCase()
                : "¿Cómo lo sentiste?";
            $("pregunta").nextElementSibling.hidden = !datos.secundarias.size;
            $("nota").value = "";
            $("intensidad").value = 5;
            $("valor").textContent = "5";
            $("detalle").style.setProperty("--c", datos.color);

            dibujarSecundarias();
            dibujarTerciarias();
            actualizarBotones();
            $("btn-volver").focus();
        }

        // muestra los matices secundarios
        function dibujarSecundarias() {
            const contenedor = $("secundarias");
            contenedor.innerHTML = "";
            for (const nombre of emocionActual.secundarias.keys()) {
                const carta = crearCarta(
                    nombre,
                    emocionActual.color,
                    "secundaria"
                );
                carta.setAttribute("aria-pressed", "false");

                carta.addEventListener("click", () => {
                    const elegido = secundariasElegidas.includes(nombre);

                    secundariasElegidas = elegido
                        ? secundariasElegidas.filter(item => item !== nombre)
                        : [...secundariasElegidas, nombre];

                    carta.setAttribute("aria-pressed", String(!elegido));
                    dibujarTerciarias();
                    actualizarBotones();
                });
                contenedor.appendChild(carta);
            }
        }

        // muestra los matices mas especificos
        function dibujarTerciarias() {
            const contenedor = $("terciarias");
            const matices = emocionActual.secundarias;
            const disponibles = secundariasElegidas.flatMap(nombre => matices.get(nombre));
            terciariasElegidas = terciariasElegidas.filter(nombre => disponibles.includes(nombre));
            contenedor.replaceChildren();
            contenedor.hidden = disponibles.length === 0;
            if (contenedor.hidden) return;

            const pista = document.createElement("p");
            pista.className = "pista";
            pista.textContent = "Si quieres, puedes precisar cada matiz.";
            contenedor.append(pista);

            for (const matiz of secundariasElegidas) {
                const grupo = document.createElement("fieldset");
                const leyenda = document.createElement("legend");
                leyenda.textContent = matiz;
                grupo.append(leyenda);

                for (const nombre of matices.get(matiz)) {
                    const chip = document.createElement("button");
                    chip.type = "button";
                    chip.className = "chip";
                    chip.textContent = nombre;
                    chip.setAttribute("aria-pressed", String(terciariasElegidas.includes(nombre)));
                    chip.addEventListener("click", () => {
                        const elegido = terciariasElegidas.includes(nombre);
                        terciariasElegidas = elegido
                            ? terciariasElegidas.filter(item => item !== nombre)
                            : [...terciariasElegidas, nombre];
                        chip.setAttribute("aria-pressed", String(!elegido));
                    });
                    grupo.append(chip);
                }
                contenedor.append(grupo);
            }
        }

        // activa los botones cuando hay una seleccion
        function actualizarBotones() {
            const puedeAgregar = !emocionActual.secundarias.size || secundariasElegidas.length > 0;
            $("btn-guardar").disabled = !(puedeAgregar || grupoActual.length);
            $("btn-otra").disabled = !puedeAgregar;
        }

        // agrega la emocion al registro actual
        function guardarEnGrupo() {
            if (emocionActual.secundarias.size && !secundariasElegidas.length) return;

            grupoActual.push({
                core: emocionActual.nombre,
                subs: secundariasElegidas.slice(),
                fine: terciariasElegidas.slice(),
                note: $("nota").value.trim(),
                intensity: Number($("intensidad").value)
            });
        }

        // regresa al mazo principal
        function volverAlMazo() {
            $("detalle").classList.remove("visible");
            $("rueda").hidden = false;
            enfocarCarta(ultimaCarta);
            $("agregadas").innerHTML = "";

            grupoActual.forEach(g => {
                const chip = document.createElement("span");
                chip.className = "etiqueta-emocion";
                chip.style.setProperty("--c", colorDeRegistro(g.core));
                chip.textContent =
                    nombreVisible(g.core) + ": " + g.subs.join(", ") + " · " + g.intensity + "/10";
                $("agregadas").appendChild(chip);
            });
        }

        $("intensidad").addEventListener("input", evento => {
            $("valor").textContent = evento.target.value;
        });

        $("btn-otra").addEventListener("click", () => {
            guardarEnGrupo();
            volverAlMazo();
        });

        $("btn-volver").addEventListener("click", volverAlMazo);

        // Conserva el grupo si la base rechaza el envío.
        $("btn-guardar").addEventListener("click", async () => {
            if (guardandoEmocion || !sesion.token()) return;
            const grupoAnterior = grupoActual.slice();
            guardarEnGrupo();
            if (!grupoActual.length) return;

            const grupo = grupoActual.slice();
            const huella = JSON.stringify(grupo);
            if (intentoEmocion?.huella !== huella) {
                intentoEmocion = {huella, id: crypto.randomUUID()};
            }

            guardandoEmocion = true;
            $("btn-guardar").disabled = true;
            try {
                await api("PUT", rutaEmociones + "/" + intentoEmocion.id, {group: grupo});
                intentoEmocion = null;
                grupoActual = [];
                volverAlMazo();
                mostrarAviso("Registro guardado");
                await cargarHistorial();
            } catch (error) {
                // se conserva la seleccion si no se puede guardar
                grupoActual = grupoAnterior;
                mostrarAviso(error.message);
            } finally {
                guardandoEmocion = false;
                $("btn-guardar").disabled = false;
            }
        });

        // muestra el historial de emociones
        function mostrarHistorial() {
            const contenedor = $("entradas");
            contenedor.innerHTML = "";

            const validos = historial.filter(r =>
                r && Array.isArray(r.group) && r.group.length &&
                r.group.every(g =>
                    g && typeof g.core === "string" && g.core.trim() &&
                    Array.isArray(g.subs) &&
                    Array.isArray(g.fine)
                )
            );

            if (!validos.length) {
                const vacio = document.createElement("p");
                vacio.className = "vacio";
                vacio.textContent = "Aún no tienes registros.";
                contenedor.appendChild(vacio);
                return;
            }

            validos.forEach(entrada => {
                const articulo = document.createElement("article");
                articulo.className = "entrada";

                const fecha = document.createElement("small");
                fecha.textContent = new Date(entrada.t).toLocaleString("es-MX", {
                    dateStyle: "medium",
                    timeStyle: "short"
                });
                articulo.appendChild(fecha);

                entrada.group.forEach(g => {
                    const parrafo = document.createElement("p");
                    const titulo = document.createElement("strong");
                    titulo.style.setProperty("--tono-emocion", colorDeRegistro(g.core));
                    titulo.textContent = nombreVisible(g.core);
                    parrafo.appendChild(titulo);

                    const matices = g.subs.concat(g.fine).join(", ");
                    parrafo.appendChild(document.createTextNode(
                        (matices ? " — " + matices : "") + " · intensidad " + g.intensity + "/10"
                    ));

                    if (g.note) {
                        const nota = document.createElement("span");
                        nota.className = "nota-entrada";
                        nota.textContent = g.note;
                        parrafo.appendChild(nota);
                    }
                    articulo.appendChild(parrafo);
                });
                contenedor.appendChild(articulo);
            });
        }

        // mensaje de confirmacion
        function mostrarAviso(mensaje) {
            const aviso = $("quemao");
            aviso.textContent = mensaje;
            aviso.classList.add("visible");
            setTimeout(() => aviso.classList.remove("visible"), 2200);
        }

        cargarCatalogo();
        cargarHistorial();
        window.addEventListener("focus", cargarCatalogo);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") cargarCatalogo();
        });
        window.addEventListener("pageshow", evento => {
            if (evento.persisted) cargarCatalogo();
        });
    </script>
</body>
</html>
