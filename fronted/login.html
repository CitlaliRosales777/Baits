
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodsitto | Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html" class="marca">Moodsitto</a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html" class="activo">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>
    <main class="pagina-formulario">
        <section class="formulario">
            <p class="etiqueta">BIENVENIDO DE NUEVO</p>
            <h1>Iniciar sesión</h1>
            <p class="texto-suave">
                Accede a tu espacio personal.
            </p>
            <form id="login-form">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="mail"
                    placeholder="tu@correo.com"
                    autocomplete="email"
                    required
                >
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="passw"
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    required
                >
                <button type="submit" class="boton ancho">
                    Ingresar
                </button>
                <p id="login-mensaje" class="mensaje"></p>
            </form>
            <p class="pie-formulario">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>
        </section>
    </main>
    <footer>
        Moodsitto · 2026
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
