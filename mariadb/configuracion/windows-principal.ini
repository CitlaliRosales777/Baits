# Configuración del principal de MariaDB con escucha privada y registro binario.
[mysqld]
datadir=C:/Program Files/MariaDB 11.4/data
port=3306
bind-address=127.0.0.1,100.89.172.17
named-pipe=ON
socket=MariaDB

server_id=1
log_bin=mariadb-bin
binlog_format=ROW
gtid_strict_mode=ON
log_slave_updates=ON
expire_logs_days=7
sync_binlog=1
innodb_flush_log_at_trx_commit=1

innodb_buffer_pool_size=1G
max_connections=80
tmp_table_size=32M
max_heap_table_size=32M
skip_name_resolve=ON
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

[client]
port=3306
socket=MariaDB
plugin-dir=C:/Program Files/MariaDB 11.4/lib/plugin

