# Configuración del equipo Windows fijo desktop-smecf2n (100.89.172.17).
storage:
  dbPath: C:/Program Files/MongoDB/Server/8.0/data
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: C:/Program Files/MongoDB/Server/8.0/log/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1,100.89.172.17

security:
  authorization: enabled
  keyFile: C:/ProgramData/Moodsitto/mongodb-keyfile

replication:
  replSetName: rsMoodsitto

setParameter:
  diagnosticDataCollectionEnabled: true
