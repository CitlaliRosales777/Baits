# Configuración de la laptop desktop-0ddrldi (100.86.5.50). Le dejamos prioridad 0 para que no sea elegida como principal.
storage:
  dbPath: C:/Program Files/MongoDB/Server/8.0/data
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  logAppend: true
  path: C:/Program Files/MongoDB/Server/8.0/log/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1,100.86.5.50
security:
  authorization: enabled
  keyFile: C:/ProgramData/Moodsitto/mongodb-keyfile
replication:
  replSetName: rsMoodsitto
setParameter:
  diagnosticDataCollectionEnabled: true

